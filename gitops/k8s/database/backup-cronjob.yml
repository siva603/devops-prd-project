apiVersion: batch/v1
kind: CronJob
metadata:
  name: boutique-db-backup
  namespace: boutique
spec:
  # Run daily at 02:00 AM UTC
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: postgres:15-alpine
              command:
                - sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backups"
                  mkdir -p $BACKUP_DIR

                  echo "[$(date)] Starting automated database backup..."
                  for DB in auth_db products_db orders_db users_db; do
                    echo "Dumping database: $DB"
                    pg_dump -h boutique-postgres -U postgres -d $DB | gzip > "$BACKUP_DIR/${DB}_${TIMESTAMP}.sql.gz"
                  done

                  # Save latest symlink/marker for rapid recovery
                  echo "$TIMESTAMP" > "$BACKUP_DIR/latest_backup_timestamp.txt"
                  echo "[$(date)] Automated backup completed successfully."

                  # Prune backups older than 30 days
                  find $BACKUP_DIR -name "*.sql.gz" -type f -mtime +30 -delete
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: boutique-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: boutique-db-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boutique-db-backup-pvc
  namespace: boutique
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
