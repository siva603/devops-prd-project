name: Production DevOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}
  # Trivy image gate: 0 = report only (never blocks), 1 = block the build when HIGH/CRITICAL fixable findings exist.
  # Change it without editing this file:
  # repo Settings > Secrets and variables > Actions > Variables > TRIVY_EXIT_CODE
  TRIVY_EXIT_CODE: ${{ vars.TRIVY_EXIT_CODE || '0' }}

jobs:
  # ============================================================================
  # Stage 1: Automated Unit & Integration Testing for Node.js Code
  # ============================================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: projects/boutique-microservices/backend/package.json

      - name: Run Microservices Unit Tests
        run: |
          cd projects/boutique-microservices/backend
          echo "Running unit tests across all microservices..."
          node --test services/*/tests/*.test.mjs

  # ============================================================================
  # Stage 2: Trivy Filesystem, Dependency & Secret Scan (report only, e-mailed at the end)
  # ============================================================================
  security-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repo & Dependencies)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-fs.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Show findings in the log and job summary
        if: always()
        run: |
          if [ -f trivy-fs.json ]; then
            {
              echo "### Trivy filesystem scan"
              echo '```'
              bash .github/scripts/trivy-report.sh detail trivy-fs.json
              echo "Total findings: $(bash .github/scripts/trivy-report.sh count trivy-fs.json)"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No Trivy report was created"
          fi

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs
          path: trivy-fs.json
          if-no-files-found: ignore

  # ============================================================================
  # Stage 3: Build Docker Image, Perform Trivy Image Scan & Push to ECR
  # ============================================================================
  build-scan-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [test, security-fs-scan]
    env:
      REPORT_FILE: trivy-image-${{ matrix.service }}.json
    strategy:
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Build Path
        id: build-path
        run: |
          if [ "${{ matrix.service }}" == "frontend" ]; then
            echo "path=projects/boutique-microservices/frontend" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "order-service" ]; then
            echo "path=projects/boutique-microservices/backend/services/order-service" >> $GITHUB_OUTPUT
          else
            echo "path=projects/boutique-microservices/backend/services/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Local Docker Image
        run: |
          LOCAL_IMAGE="${{ matrix.service }}:${{ github.sha }}"
          echo "Building $LOCAL_IMAGE from ${{ steps.build-path.outputs.path }}"
          docker build -t $LOCAL_IMAGE ${{ steps.build-path.outputs.path }}

      # Scan the image and save the report (this step never fails the job)
      - name: Trivy Container Image Security Scan
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          image-ref: '${{ matrix.service }}:${{ github.sha }}'
          format: 'json'
          output: '${{ env.REPORT_FILE }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Show findings in the log and job summary
        if: always()
        run: |
          if [ -f "$REPORT_FILE" ]; then
            {
              echo "### Trivy image scan - ${{ matrix.service }}"
              echo '```'
              bash .github/scripts/trivy-report.sh detail "$REPORT_FILE"
              echo "Total findings: $(bash .github/scripts/trivy-report.sh count "$REPORT_FILE")"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No Trivy report was created"
          fi

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ matrix.service }}
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: ignore

      # Security gate. It only blocks when TRIVY_EXIT_CODE is 1, and it runs before the ECR login,
      # so a failed gate means the image is not pushed.
      - name: Trivy Security Gate
        run: |
          FINDINGS=$(bash .github/scripts/trivy-report.sh count "$REPORT_FILE")
          echo "Fixable HIGH/CRITICAL findings: $FINDINGS (gate setting TRIVY_EXIT_CODE=$TRIVY_EXIT_CODE)"
          if [ "$TRIVY_EXIT_CODE" = "1" ] && [ "$FINDINGS" -gt 0 ]; then
            echo "Security gate failed: fix the findings listed above before this image can be pushed"
            exit 1
          fi

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS \
          --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Tag and Push Docker Image to ECR
        if: github.ref == 'refs/heads/main'
        run: |
          ECR_IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/boutique-${{ matrix.service }}:${{ github.sha }}"
          docker tag ${{ matrix.service }}:${{ github.sha }} $ECR_IMAGE
          echo "Pushing $ECR_IMAGE"
          docker push $ECR_IMAGE

  # ============================================================================
  # Stage 4: Update GitOps Kubernetes Manifests with New Image Tags
  # ============================================================================
  update-manifests:
    name: GitOps Sync
    runs-on: ubuntu-latest
    needs: build-scan-and-push
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in k8s manifests
        run: |
          NEW_TAG=${{ github.sha }}
          ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          REGION=${{ secrets.AWS_REGION }}

          for SERVICE in auth gateway orders order-service product-service user-service; do
            MANIFEST="gitops/k8s/backend/${SERVICE}.yml"
            if [ -f "$MANIFEST" ]; then
              sed -i "s|${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/boutique-${SERVICE}:.*|${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/boutique-${SERVICE}:${NEW_TAG}|g" $MANIFEST
            fi
          done

          sed -i "s|${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/boutique-frontend:.*|${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/boutique-frontend:${NEW_TAG}|g" gitops/k8s/frontend/deployment.yml

      - name: Commit and Push Updated Manifests for ArgoCD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/k8s/
          git diff --staged --quiet || git commit -m "ci: update production image tags to ${{ github.sha }}"
          git push

  # ============================================================================
  # Stage 5: E-mail the Trivy result (runs even when earlier jobs fail)
  # ============================================================================
  trivy-email:
    name: Email Trivy Report
    runs-on: ubuntu-latest
    needs: [security-fs-scan, build-scan-and-push]
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all Trivy reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: trivy-*
          path: reports
          merge-multiple: true

      - name: Build summary and send e-mail
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE: ${{ env.TRIVY_EXIT_CODE }}
          SERVICES: "auth gateway orders order-service product-service user-service frontend"
        run: |
          mkdir -p reports
          bash .github/scripts/trivy-report.sh email reports