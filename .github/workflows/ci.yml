name: Production DevOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================================================
  # Stage 1: Automated Unit & Integration Testing for Node.js Code
  # ============================================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: projects/boutique-microservices/backend/package.json

      - name: Run Microservices Unit Tests
        run: |
          cd projects/boutique-microservices/backend
          echo "Running unit tests across all microservices..."
          node --test services/*/tests/*.test.mjs

  # ============================================================================
  # Stage 2: Trivy Filesystem, Dependency & Secret Vulnerability Scan
  # ============================================================================
  security-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repo & Dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Set to '1' in strict PRD to fail builds on critical CVEs
          ignore-unfixed: true

  # ============================================================================
  # Stage 3: Build Docker Image, Perform Trivy Image Scan & Push to ECR
  # ============================================================================
  build-scan-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [test, security-fs-scan]
    strategy:
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Build Path
        id: build-path
        run: |
          if [ "${{ matrix.service }}" == "frontend" ]; then
            echo "path=projects/boutique-microservices/frontend" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "order-service" ]; then
            echo "path=projects/boutique-microservices/backend/services/order-service" >> $GITHUB_OUTPUT
          else
            echo "path=projects/boutique-microservices/backend/services/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Local Docker Image
        run: |
          LOCAL_IMAGE="${{ matrix.service }}:${{ github.sha }}"
          echo "Building $LOCAL_IMAGE from ${{ steps.build-path.outputs.path }}"
          docker build -t $LOCAL_IMAGE ${{ steps.build-path.outputs.path }}

      # Security: Scan the newly built Docker Image with Trivy
      - name: Trivy Container Image Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Set to '1' to enforce strict security gates
          ignore-unfixed: true

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS \
          --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Tag and Push Docker Image to ECR
        if: github.ref == 'refs/heads/main'
        run: |
          ECR_IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/boutique-${{ matrix.service }}:${{ github.sha }}"
          docker tag ${{ matrix.service }}:${{ github.sha }} $ECR_IMAGE
          echo "Pushing $ECR_IMAGE"
          docker push $ECR_IMAGE

  # ============================================================================
  # Stage 4: Update GitOps Kubernetes Manifests with New Image Tags
  # ============================================================================
  update-manifests:
    name: GitOps Sync
    runs-on: ubuntu-latest
    needs: build-scan-and-push
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in k8s manifests
        run: |
          NEW_TAG=${{ github.sha }}
          ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          REGION=${{ secrets.AWS_REGION }}

          for SERVICE in auth gateway orders order-service product-service user-service; do
            MANIFEST="gitops/k8s/backend/${SERVICE}.yml"
            if [ -f "$MANIFEST" ]; then
              sed -i "s|${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/boutique-${SERVICE}:.*|${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/boutique-${SERVICE}:${NEW_TAG}|g" $MANIFEST
            fi
          done

          sed -i "s|${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/boutique-frontend:.*|${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/boutique-frontend:${NEW_TAG}|g" gitops/k8s/frontend/deployment.yml

      - name: Commit and Push Updated Manifests for ArgoCD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/k8s/
          git diff --staged --quiet || git commit -m "ci: update production image tags to ${{ github.sha }}"
          git push
